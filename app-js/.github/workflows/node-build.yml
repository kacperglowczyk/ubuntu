name: Node.js Build

on:
  push:
    branches: [ "LabDevOps" ]
  pull_request:
    branches: [ "LabDevOps" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Check build
      run: |
        npm install
    
    - name: Run tests
      run: |
 
        npm test || exit 0